name: aether_diary
description: A premium, cinematic, and emotional digital diary.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  
  # Local Storage & Encryption
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.1.0
  
  # UI, Animations & Styling
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  rive: ^0.11.4
  glassmorphism: ^3.0.0
  
  # Utilities & Hardware
  intl: ^0.20.2
  uuid: ^4.5.3
  cupertino_icons: ^1.0.2
  local_auth: ^3.0.1
  fl_chart: ^1.2.0
  table_calendar: ^3.0.9
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.0
  
  # FIXED: Strict Version Lock. No carats (^). 
  # This guarantees the Java Android 33 fix without the v20 syntax breakages.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  wakelock_plus: ^1.6.1
  video_player: ^2.11.1
  audioplayers: ^6.8.1
  record: ^6.2.0
  quick_actions: ^1.1.0
  open_filex: ^4.7.0
  image: ^4.3.0
  share_plus: ^13.3.0
  flutter_background_service: ^5.1.0
  home_widget: ^0.9.3
  pdf: ^3.12.0
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.1
  flutter_quill: ^11.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true